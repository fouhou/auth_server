# auth_server 对接 Nginx auth_request 的完整网关配置
# 安装: sudo cp authdemo.conf /etc/nginx/sites-available/authdemo
#       sudo ln -sf ../sites-available/authdemo /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 架构: 客户端 -> Nginx:8080
#         ├── auth_request 子请求 /_auth -> auth_server:8081 (检测+鉴权)
#         └── 200 放行 -> 本地静态资源(模拟受保护业务) , 透传 X-User-Id

# upstream keepalive: 避免每个 auth 子请求都新建 TCP 连接(默认每次握手+挥手,压测仅 866 QPS)
upstream auth_backend {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # ---- 鉴权子请求: 原样转发攻击面, 由 auth_server 判定 ----
    location = /_auth {
        internal;
        proxy_pass http://auth_backend/auth;
        proxy_http_version 1.1;                 # keepalive 连接池要求 1.1
        proxy_set_header Connection "";         # 清空 Connection 头,连接归还 keepalive 池

        # 子请求不携带 body(鉴权只看 URI/头)
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # 还原原始请求要素, 供走私检测/WAF/鉴权使用
        # (Authorization/Cookie/X-Api-Key 是三种鉴权方式的凭证通道,必须透传)
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header X-Api-Key         $http_x_api_key;
        proxy_set_header User-Agent        $http_user_agent;
        proxy_set_header Referer           $http_referer;
        # 客户端真实 IP: 限流/暴力锁定键的信任来源($remote_addr 是 TCP 层对端,
        # 客户端伪造不了; 服务端需 TRUST_PROXY=1 才启用, 直连模式忽略此头)
        proxy_set_header X-Real-IP         $remote_addr;
        # 客户端原始定界头(走私检测的网关形态证据): 子请求无 body 且 CL 被清空,
        # 用别名头透传客户端原始值, 服务端 smuggling_check 做二次词法判罚;
        # 重复头由 Nginx 以 ", " 拼接(多 CL 分歧证据不丢失), 空值时该头不发送
        proxy_set_header X-Original-CL     $http_content_length;
        proxy_set_header X-Original-TE     $http_transfer_encoding;
    }

    # ---- 受保护资源 ----
    location / {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_user_id;
        # auth_request 模块限制: 子请求非 2xx/401/403 的状态(如 429)会被转为 500,
        # 故捕获子请求状态码, 在 error_page 500 中还原 429 语义
        auth_request_set $auth_status $upstream_status;
        add_header X-User $auth_user always;

        root /var/www/authdemo;
        index index.html;

        error_page 500 = @limited;
    }

    # ---- 错误应答统一 JSON, 401 附 WWW-Authenticate ----
    error_page 401 = @unauthorized;
    location @unauthorized {
        default_type application/json;
        add_header WWW-Authenticate 'Bearer realm="authdemo"' always;
        return 401 '{"error":"unauthorized"}';
    }
    error_page 403 = @forbidden;
    location @forbidden {
        default_type application/json;
        return 403 '{"error":"forbidden"}';
    }
    # 429 由 @limited 中依据 $auth_status 还原(auth_request 会把 429 转 500)
    location @limited {
        default_type application/json;
        if ($auth_status = 429) {
            return 429 '{"error":"rate_limited"}';
        }
        return 500 '{"error":"internal_error"}';
    }
}
